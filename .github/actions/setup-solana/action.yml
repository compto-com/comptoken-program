# adjusted from https://github.com/metaDAOproject/setup-solana/blob/3769a7937e9897f27805e9665507b7b754cbc7fc/action.yml
name: "Setup Solana"
description: "Install the Solana Tool Suite."
inputs:
    solana-cli-version:
        description: "Version of Solana CLI to use"
        required: false
        default: "from-anchor-toml"
    anchor-version:
        description: "Version of Anchor to install"
        required: false
        default: "from-anchor-toml"
outputs:
    installed-solana-cli-version:
        description: "The version of Solana CLI that was installed"
        value: ${{ steps.solana-release.outputs.install_version }}
    installed-anchor-version:
        description: "The version of Anchor that was installed"
        value: ${{ steps.anchor-version.outputs.installed_anchor_version }}
runs:
    using: "composite"
    steps:
        - name: download scripts
          run: |
              mkdir -p scripts/semver_bash
              curl -sSfL https://raw.githubusercontent.com/anza-xyz/agave/master/ci/channel-info.sh -o scripts/channel-info.sh
              curl -sSfL https://raw.githubusercontent.com/anza-xyz/agave/master/ci/semver_bash/semver.sh -o scripts/semver_bash/semver.sh
          shell: bash

        - name: Resolve toolchain versions
          id: resolve-versions
          run: |
              INPUT_SOLANA_VERSION='${{ inputs.solana-cli-version }}'
              INPUT_ANCHOR_VERSION='${{ inputs.anchor-version }}'

              TOML_SOLANA_VERSION=""
              TOML_ANCHOR_VERSION=""
              if [ -f Anchor.toml ]; then
                  TOML_SOLANA_VERSION=$(grep -E '^\s*solana_version\s*=' Anchor.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
                  TOML_ANCHOR_VERSION=$(grep -E '^\s*anchor_version\s*=' Anchor.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
              fi

              if [ "$INPUT_SOLANA_VERSION" = "from-anchor-toml" ]; then
                  SOLANA_VERSION="$TOML_SOLANA_VERSION"
              else
                  SOLANA_VERSION="$INPUT_SOLANA_VERSION"
              fi

              if [ "$INPUT_ANCHOR_VERSION" = "from-anchor-toml" ]; then
                  ANCHOR_VERSION="$TOML_ANCHOR_VERSION"
              else
                  ANCHOR_VERSION="$INPUT_ANCHOR_VERSION"
              fi

              if [ -z "$SOLANA_VERSION" ]; then
                  echo "Could not resolve Solana CLI version (input=$INPUT_SOLANA_VERSION)."
                  echo "If using from-anchor-toml, ensure Anchor.toml has toolchain.solana_version."
                  exit 1
              fi

              if [ -z "$ANCHOR_VERSION" ]; then
                  echo "Could not resolve Anchor version (input=$INPUT_ANCHOR_VERSION)."
                  echo "If using from-anchor-toml, ensure Anchor.toml has toolchain.anchor_version."
                  exit 1
              fi

              echo "Using Solana CLI version selector: $SOLANA_VERSION"
              echo "Using Anchor version selector: $ANCHOR_VERSION"
              echo "solana_cli_version=$SOLANA_VERSION" >> "$GITHUB_OUTPUT"
              echo "anchor_version=$ANCHOR_VERSION" >> "$GITHUB_OUTPUT"
          shell: bash

        - name: Determine Solana CLI version
          id: solana-release
          run: |
              chmod +x scripts/channel-info.sh
              output=$("scripts/channel-info.sh")
              read -r BETA_CHANNEL_LATEST_TAG STABLE_CHANNEL_LATEST_TAG <<< "$output"

              SOLANA_VERSION='${{ steps.resolve-versions.outputs.solana_cli_version }}'

              if [[ "$SOLANA_VERSION" =~ ^[a-zA-Z] ]]; then
                if [[ "$SOLANA_VERSION" =~ ^(edge|stable|beta)$ ]]; then
                  if [[ "$SOLANA_VERSION" == "edge" ]]; then
                    echo "Using Solana CLI edge channel"
                    echo "install_version=edge" >> $GITHUB_OUTPUT
                  elif [[ "$SOLANA_VERSION" == "stable" ]]; then
                    echo "install_version=$STABLE_CHANNEL_LATEST_TAG" >> $GITHUB_OUTPUT
                    echo "Using Solana CLI stable channel $STABLE_CHANNEL_LATEST_TAG"
                  elif [[ "$SOLANA_VERSION" == "beta" ]]; then
                    echo "Using Solana CLI beta channel"
                    echo "install_version=$BETA_CHANNEL_LATEST_TAG" >> $GITHUB_OUTPUT
                  fi
                else
                  echo "Invalid Solana CLI channel: $SOLANA_VERSION"
                  exit 1
                fi
              else
                echo "Using Solana CLI $SOLANA_VERSION"
                echo "install_version=v$SOLANA_VERSION" >> $GITHUB_OUTPUT
              fi
          shell: bash

        - name: Cache Solana CLI tools
          uses: actions/cache@v3
          if: steps.solana-release.outputs.install_version != 'edge'
          with:
              path: |
                  ~/.cache/solana/
                  ~/.local/share/solana/
              key: solana-cli-${{ runner.os }}-build-${{ steps.solana-release.outputs.install_version }}

        - name: Install Solana CLI tools
          run: curl -sSfL https://release.anza.xyz/${{ steps.solana-release.outputs.install_version }}/install | bash
          shell: bash

        - name: Update PATH
          run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          shell: bash

        - name: Install Anchor
          id: anchor-version
          run: |
              cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
              avm install "${{ steps.resolve-versions.outputs.anchor_version }}"
              avm use "${{ steps.resolve-versions.outputs.anchor_version }}"
              echo "installed_anchor_version=$(anchor --version | awk '{print $3}')" >> $GITHUB_OUTPUT
          shell: bash

        - name: Test install
          run: |
              solana --version
              anchor --version
          shell: bash
