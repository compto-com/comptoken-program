[package]
name = "comptoken"
version = "0.2.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "comptoken"

[features]
default = ["mainnet"]
mainnet = ["solana-world-id-program/mainnet"]
devnet = ["solana-world-id-program/testnet"]
testmode = ["devnet", "solana-world-id-program/testmode"]

cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
bytemuck = { version = "1.24.0", features = ["min_const_generics"] }
ethnum = "1.5.2"
hex = "0.4.3"
solana-hash = { version = "3.0.0", features = ["borsh"] }
solana-world-id-program = { path = "../solana-world-id-program", features = [
    "cpi",
], default-features = false }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
