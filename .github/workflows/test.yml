name: Run Tests on Pull Request
on: pull_request
jobs:
    rust-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Setup Solana
              id: setup-solana
              uses: ./.github/actions/setup-solana

            - name: Generate keypair
              run: solana-keygen new --no-bip39-passphrase --silent

            - name: Run rust tests
              run: cargo test-sbf

    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Setup Solana
              uses: ./.github/actions/setup-solana

            - name: Generate keypair
              run: solana-keygen new --no-bip39-passphrase --silent

            - name: Generate program keypairs
              run: |
                  mkdir -p target/deploy
                  echo "${{ secrets.COMPTOKEN_KEYPAIR }}" > target/deploy/comptoken-keypair.json
                  echo "${{ secrets.SOLANA_WORLD_ID_PROGRAM_KEYPAIR }}" > target/deploy/solana_world_id_program-keypair.json

            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "24"

            - name: Install tsx
              run: npm install -g tsx

            - name: build with validator
              run: |
                  export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
                  anchor build -p comptoken -- --features=devnet --no-default-features
                  anchor build -p solana_world_id_program

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: comptoken-build
                  include-hidden-files: true
                  path: |
                      target/deploy/*
                      target/idl/*
                      test/.cache/*

    component-tests:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Setup Solana
              uses: ./.github/actions/setup-solana

            - name: Generate keypair
              run: solana-keygen new --no-bip39-passphrase --silent

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: comptoken-build

            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "20"

            - name: Install js dependencies
              run: npm clean-install --legacy-peer-deps # bankrun is discontinued, but it's replacement doesn't work

            - name: Install tsx
              run: npm install -g tsx

            - name: run component tests
              run: anchor test --skip-build

    integration-tests:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Setup Solana
              uses: ./.github/actions/setup-solana

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: comptoken-build

            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "20"

            - name: Install js dependencies
              run: npm clean-install --legacy-peer-deps # bankrun is discontinued, but it's replacement doesn't work

            - name: run integration tests
              run: echo "integration tests to be implemented"

            - name: Validator logs on failure
              if: failure()
              run: |
                  echo "Validator logs:"
                  echo "Solana CLI version:"
                  solana --version
                  echo "Anchor version:"
                  anchor --version
                  echo "Solana config:"
                  solana config get
