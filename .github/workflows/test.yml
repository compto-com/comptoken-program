name: Run Tests on Pull Request
on: pull_request
jobs:
    rust-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Install Solana CLI tools
              run: curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/solana-developers/solana-install/main/install.sh | bash
              shell: bash

            - name: Update PATH
              run: echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
              shell: bash

            - name: Generate keypair
              run: solana-keygen new --no-bip39-passphrase --silent

            - name: Run rust tests
              run: cargo test-sbf

    build-for-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Install Solana CLI tools
              run: curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/solana-developers/solana-install/main/install.sh | bash
              shell: bash
            - run: echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
              shell: bash
            - run: solana-keygen new --no-bip39-passphrase --silent

            - name: Setup python
              uses: actions/setup-python@v2
              with:
                  python-version: "3.12" # it doesn't work with 3.10, don't know about 3.11

            - name: Generate program keypairs
              run: |
                  mkdir -p target/deploy
                  solana-keygen new --no-bip39-passphrase --silent --outfile target/deploy/comptoken-keypair.json
                  solana-keygen new --no-bip39-passphrase --silent --outfile target/deploy/comptoken_transfer_hook-keypair.json
                  solana-keygen new --no-bip39-passphrase --silent --outfile test/.cache/comptoken_mint-keypair.json

            - name: build with validator
              run: |
                  (
                    mkdir -p test/.cache/
                    cd test/.cache/
                    solana-test-validator --reset --ledger test-ledger &
                    validator_pid=$!
                    trap "kill $validator_pid" EXIT
                    sleep 5
                    cd ../..
                    python3 test/build_comptoken_program.py
                  )

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: comptoken-build
                  path: |
                      target/deploy/*
                      comptoken/src/generated/comptoken_generated.rs
                      comptoken-transfer-hook/src/generated/comptoken_generated.rs
                      test/.cache/*

    component-tests:
        runs-on: ubuntu-latest
        needs: build-for-tests
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Install Solana CLI tools
              run: curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/solana-developers/solana-install/main/install.sh | bash
              shell: bash
            - run: echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
              shell: bash
            - run: solana-keygen new --no-bip39-passphrase --silent

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: comptoken-build

            - name: Setup python
              uses: actions/setup-python@v2
              with:
                  python-version: "3.12" # it doesn't work with 3.10, don't know about 3.11

            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "20"

            - name: Install js dependencies
              run: npm clean-install --prefix ./test/compto-test-client

            - name: run component tests
              run: python3 test/component_tests.py --no-build --no-reset # calls node.js scripts to run tests; do not reset the validator

    integration-tests:
        runs-on: ubuntu-latest
        needs: build-for-tests
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Install Solana CLI tools
              run: curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/solana-developers/solana-install/main/install.sh | bash
              shell: bash
            - run: echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
              shell: bash
            - run: solana-keygen new --no-bip39-passphrase --silent

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: comptoken-build

            - name: Setup python
              uses: actions/setup-python@v2
              with:
                  python-version: "3.12" # it doesn't work with 3.10, don't know about 3.11

            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "20"

            - name: Install js dependencies
              run: npm clean-install --prefix ./test/compto-test-client

            - name: run integration tests
              run: python3 test/full_deploy_test.py --no-build --no-reset # calls node.js scripts to run tests; do not reset the validator
